name: github-actions
run-name: ${{ github.actor }} is testing odoo addons
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Python syntax check
        run: python -m compileall estate estate_account meeting_schedule

      - name: XML syntax check
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          xmllint --noout estate/views/*.xml estate_account/views/*.xml meeting_schedule/views/*.xml meeting_schedule/security/*.xml 2>&1 || find estate estate_account meeting_schedule -name '*.xml' -exec xmllint --noout {} + echo "All XML OK"